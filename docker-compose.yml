name: novacommerce

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:17.4-alpine3.21
    container_name: novacommerce-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-novacommerce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-novacommerce}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - novacommerce
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-novacommerce} -d ${POSTGRES_DB:-novacommerce}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging

  redis:
    image: redis:7.4.2-alpine3.21
    container_name: novacommerce-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-change-me} --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - novacommerce
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-change-me}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging

  opensearch:
    image: opensearchproject/opensearch:2.19.1
    container_name: novacommerce-opensearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      bootstrap.memory_lock: "true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    networks:
      - novacommerce
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    logging: *default-logging

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: novacommerce-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-novacommerce}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - novacommerce
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    container_name: novacommerce-migrate
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-novacommerce}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-novacommerce}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - novacommerce
    logging: *default-logging

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: novacommerce-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-novacommerce}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-novacommerce}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-change-me}@redis:6379/0
      OPENSEARCH_URL: http://opensearch:9200
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-novacommerce}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-change-me}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string}
      AI_SERVICE_URL: http://ai-service:8000
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      minio:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    networks:
      - novacommerce
    logging: *default-logging

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: novacommerce-worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-novacommerce}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-novacommerce}?schema=public
      WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-5000}
    depends_on:
      migrate:
        condition: service_completed_successfully
      api:
        condition: service_started
    networks:
      - novacommerce
    logging: *default-logging

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000}
    container_name: novacommerce-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      HOSTNAME: 0.0.0.0
    ports:
      - "3001:3001"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - novacommerce
    logging: *default-logging

  admin:
    build:
      context: .
      dockerfile: Dockerfile.admin
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000}
    container_name: novacommerce-admin
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3002
      HOSTNAME: 0.0.0.0
    ports:
      - "3002:3002"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - novacommerce
    logging: *default-logging

  ai-service:
    build:
      context: .
      dockerfile: Dockerfile.ai
    container_name: novacommerce-ai
    restart: unless-stopped
    environment:
      PORT: 8000
    ports:
      - "8000:8000"
    networks:
      - novacommerce
    logging: *default-logging

  kafka:
    profiles:
      - future
    image: soldevelo/kafka:3.9.2
    container_name: novacommerce-kafka
    restart: unless-stopped
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/bitnami/kafka
    networks:
      - novacommerce
    logging: *default-logging

networks:
  novacommerce:
    name: novacommerce-network
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  opensearch_data:
  minio_data:
  kafka_data:
